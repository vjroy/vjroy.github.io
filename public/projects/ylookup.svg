  <!-- footer chips -->
  <g font-size="16">
    <rect x="150" y="748" width="392" height="44" rx="22" fill="none" stroke="#2e3a33"/>
    <text x="174" y="776" fill="#828f86">YLookup × Encode · London · Sept 2026</text>
    <rect x="558" y="748" width="286" height="44" rx="22" fill="none" stroke="#2e3a33"/>
    <text x="582" y="776" fill="#828f86">Qwen3.8-27B · Tinker</text>
  </g>
</svg>
